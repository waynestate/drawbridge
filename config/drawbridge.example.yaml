# Drawbridge gateway config. Copy to drawbridge.yaml, edit, and check it with:
#   bin/drawbridge config:validate --config=drawbridge.yaml
#   bin/drawbridge explain app1.apps.wayne.edu /admin/users --config=drawbridge.yaml
#
# Nothing secret goes in this file. The OpenID Connect client secret and crypto passphrase are environment
# variables, and the assertion signing key is a mounted file (see .env.example).

gateway:
  # The "iss" claim of the assertion Drawbridge signs. SESAME's gateway.issuer must match it exactly.
  issuer: https://auth.apps.wayne.edu

  # The header that carries the signed assertion. SESAME's default is X-Sesame-Assertion.
  assertion_header: X-Sesame-Assertion
  # Used only by apps with mode "headers" or "both".
  user_header: X-Authenticated-User
  attribute_headers:
    email: X-Authenticated-Email
    name: X-Authenticated-Name
    affiliations: X-Authenticated-Affiliations

  # How long an assertion is good for (5 to 300). Short: it is minted on every request.
  assertion_ttl_seconds: 60
  # Gateway session length per app host, in seconds (300 to 604800).
  session_seconds: 28800
  # Idle timeout in seconds (60 to 86400): a session unused this long ends.
  session_idle_seconds: 3600
  # Cookie name. With secure cookies on, the "__Host-" prefix is added for you.
  session_cookie: drawbridge

  # Extra request headers to remove from every request, besides the built-in list. A name ending in "-" is a prefix.
  strip_headers: []

# The OpenID Connect provider: Microsoft Entra ID, one app registration for the whole gateway.
oidc:
  # Entra's v2.0 issuer: https://login.microsoftonline.com/<tenant-id>/v2.0 . The zeros are a placeholder, not a tenant.
  # The issuer comes from Playbook (SESAME_OAUTH2_ISSUER); see the README, WSU values (Playbook).
  issuer: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0
  # Defaults to <issuer>/.well-known/openid-configuration, which is right for Entra.
  # metadata_url: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000000/v2.0/.well-known/openid-configuration
  # The app registration's Application (client) ID. A placeholder here.
  client_id: 00000000-0000-0000-0000-000000000000
  # The NAME of the environment variable that holds the client secret. Never the secret itself.
  client_secret_env: DRAWBRIDGE_OIDC_CLIENT_SECRET

  # The ID token claim that becomes "sub" (and X-Authenticated-User). The example uses accessid, the AccessID, which
  # your Entra admin adds as an optional claim (transformed from the user principal name with ExtractMailPrefix).
  # preferred_username still works for a tenant that does not send accessid.
  user_claim: accessid
  # Which ID token claim feeds each attribute. Set one to null to never send it. affiliations has no default.
  attribute_claims:
    email: email
    name: name
  # ID token claims copied into the assertion under the same name when present (strings, numbers or lists of them).
  # wsu_roles is the claim name Entra sends; it is mapped from the directory attribute user.wsuRoles via
  # acceptMappedClaims, so no custom signing key is needed.
  extra_claims: [wsu_roles]

  # Entra "amr" values -> the "amr" values SESAME's MFA check reads. The default covers pwd, mfa, ngcmfa (as mfa),
  # otp, rsa, wia and the REFEDS MFA URI. An unknown value gives no amr, never a guessed "mfa".
  # amr_map:
  #   mfa: [mfa]

apps:
  - id: app1
    host: app1.apps.wayne.edu
    # Where the app's container listens, as seen from the gateway. No path.
    upstream: http://app1:8080
    # "assertion" (default, a signed JWT), "headers" (plain headers, for apps that cannot verify a JWT yet), or "both".
    mode: assertion
    # What a path with no rule gets. "login" (default) is the safe choice.
    default: login
    # A path ending in "/" is a prefix ("/assets/" covers /assets and everything under it). Any other path is exact.
    # No wildcards or regular expressions. Query strings are never part of the match.
    public:
      - /up
      - /assets/
    protected:
      - /admin/
      # A rule can also need an Entra authentication context (c1 to c99): the gateway asks Entra for it, and lets
      # the request through only when the ID token's "acrs" lists it. Conditional Access decides what c1 means.
      - path: /admin/payroll/
        auth_context: c1
    # Like protected, but an unauthenticated caller gets a 401 instead of a redirect to sign in.
    api:
      - /api/
