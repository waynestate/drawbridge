name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # pin to a Preflight tag at its first GitHub release
    uses: waynestate/preflight/.github/workflows/php-package.yml@65711c350bd0ddf637f0933482d7bdae2a9b3c3b
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci

  rig:
    # The container rig: the real gateway image, a mock OpenID Connect provider and an echo app. GitHub runners have Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh rig/run.sh
