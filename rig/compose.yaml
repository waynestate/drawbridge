# The Drawbridge test rig: the real gateway image, a throwaway OpenID Connect provider and a tiny echo app, on one
# private network. Run it with rig/run.sh (Linux, macOS) or rig/run.ps1 (Windows). Nothing in here reaches Entra or
# the internet: the provider is mock-oauth2-server, which signs in anyone with whatever claims the test types in.

name: drawbridge-rig

x-rig-secrets: &rig-secrets
  # Throwaway values for the rig only. The mock provider accepts any client secret; the passphrase just has to be long.
  DRAWBRIDGE_OIDC_CLIENT_SECRET: rig-client-secret-not-a-real-one
  DRAWBRIDGE_OIDC_CRYPTO_PASSPHRASE: rig-crypto-passphrase-0123456789abcdef

services:
  keys:
    image: drawbridge-gateway:rig
    user: root
    entrypoint: ["php", "/rig/tools/prepare.php", "keys"]
    volumes:
      - keys:/keys
      - ./tools:/rig/tools:ro

  idp:
    # Pinned: a maintained mock provider (navikt/mock-oauth2-server). Its issuer is http://<host>/<issuer id>, here
    # http://idp.test:8080/entra, and its interactive login form lets a test choose the user and the claims.
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: '{"interactiveLogin": true, "httpServer": "NettyWrapper"}'
    networks:
      default:
        aliases: [idp.test]

  idp-ready:
    image: drawbridge-gateway:rig
    entrypoint: ["php", "/rig/tools/prepare.php", "idp"]
    depends_on:
      - idp
    volumes:
      - ./tools:/rig/tools:ro

  echo:
    image: php:8.4-cli
    command: ["php", "-S", "0.0.0.0:8080", "/echo/index.php"]
    volumes:
      - ./echo:/echo:ro

  gateway:
    image: drawbridge-gateway:rig
    depends_on:
      keys:
        condition: service_completed_successfully
      idp-ready:
        condition: service_completed_successfully
      echo:
        condition: service_started
    environment:
      <<: *rig-secrets
      DRAWBRIDGE_CONFIG: /rig/config/drawbridge.yaml
      DRAWBRIDGE_PUBLIC_SCHEME: http
      DRAWBRIDGE_PUBLIC_PORT: "8080"
      # Plain HTTP in the rig, so the Secure and __Host- cookie rules are off here. Production keeps them on.
      DRAWBRIDGE_COOKIE_SECURE: "false"
      DRAWBRIDGE_SIGNING_KEY_FILE: /keys/signing.key
      DRAWBRIDGE_SIGNING_KEY_ID: rig-1
      DRAWBRIDGE_LOG_LEVEL: info
    volumes:
      - keys:/keys:ro
      - ./config:/rig/config:ro
    networks:
      default:
        aliases: [echo.apps.test, legacy.apps.test, blog.apps.test, auth.apps.test]

  tester:
    image: php:8.4-cli
    profiles: [test]
    depends_on:
      gateway:
        condition: service_healthy
    working_dir: /app
    environment:
      RIG_KEYS: /keys
    volumes:
      - ..:/app:ro
      - keys:/keys:ro
    command: ["php", "vendor/bin/phpunit", "-c", "phpunit.e2e.xml.dist", "--do-not-cache-result"]

volumes:
  keys:
