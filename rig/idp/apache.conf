<VirtualHost *:80>
    ServerName idp.test
    DocumentRoot /var/simplesamlphp/public
    Alias /simplesaml /var/simplesamlphp/public
    SetEnv SIMPLESAMLPHP_CONFIG_DIR /var/simplesamlphp/config
    <Directory /var/simplesamlphp/public>
        Require all granted
        AllowOverride None
    </Directory>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
