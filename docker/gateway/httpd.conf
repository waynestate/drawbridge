# DRAWBRIDGE: the static half of the Apache config. The per-app virtual hosts are rendered into
# ${DRAWBRIDGE_RUN_DIR}/generated/apps.conf by `drawbridge render`, which the entrypoint runs first.
#
# Runs as any non-root UID on a port above 1024: no User/Group, state only under DRAWBRIDGE_RUN_DIR.

ServerRoot /etc/apache2
ServerName drawbridge.invalid
Listen ${DRAWBRIDGE_PORT}

PidFile ${DRAWBRIDGE_RUN_DIR}/httpd.pid
DefaultRuntimeDir ${DRAWBRIDGE_RUN_DIR}/run
Mutex file:${DRAWBRIDGE_RUN_DIR}/run default
ScoreBoardFile ${DRAWBRIDGE_RUN_DIR}/run/scoreboard

LoadModule mpm_event_module     /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authn_core_module    /usr/lib/apache2/modules/mod_authn_core.so
LoadModule authz_core_module    /usr/lib/apache2/modules/mod_authz_core.so
LoadModule authz_user_module    /usr/lib/apache2/modules/mod_authz_user.so
LoadModule env_module           /usr/lib/apache2/modules/mod_env.so
LoadModule setenvif_module      /usr/lib/apache2/modules/mod_setenvif.so
LoadModule headers_module       /usr/lib/apache2/modules/mod_headers.so
LoadModule reqtimeout_module    /usr/lib/apache2/modules/mod_reqtimeout.so
LoadModule remoteip_module      /usr/lib/apache2/modules/mod_remoteip.so
LoadModule rewrite_module       /usr/lib/apache2/modules/mod_rewrite.so
LoadModule proxy_module         /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module    /usr/lib/apache2/modules/mod_proxy_http.so
LoadModule lua_module           /usr/lib/apache2/modules/mod_lua.so
LoadModule auth_openidc_module  /usr/lib/apache2/modules/mod_auth_openidc.so

# Logs go to stdout and stderr (twelve-factor). The request line is logged without its query string,
# which can carry tokens.
ErrorLog /dev/stderr
LogLevel ${DRAWBRIDGE_LOG_LEVEL}
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" drawbridge
CustomLog /dev/stdout drawbridge

# Say as little as possible about ourselves, and refuse the odd requests.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
HttpProtocolOptions Strict
AllowEncodedSlashes Off
MergeSlashes On
LimitRequestLine 8190
LimitRequestFields 100
LimitRequestFieldSize 8190
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
Timeout 60
KeepAliveTimeout 5
ProxyRequests Off

<Directory />
    Require all denied
    AllowOverride None
    Options None
</Directory>

# mod_auth_openidc keeps sessions in shared memory (rendered in apps.conf). A restart signs everyone out (see OPEN_QUESTIONS.md).

# The guard runs first of all, on every request, before authentication: it refuses unsafe paths, then removes every
# header the gateway owns. The stamp is an authorization provider (Require drawbridge-stamp), because Apache stops after the first
# auth-checker hook that answers and mod_authz_core always answers. It runs only on paths that need a session.
LuaScope thread
LuaHookTranslateName /etc/drawbridge/drawbridge.lua guard early
LuaAuthzProvider drawbridge-stamp /etc/drawbridge/drawbridge.lua stamp
LuaHookFixups        /etc/drawbridge/drawbridge.lua scrub

IncludeOptional ${DRAWBRIDGE_RUN_DIR}/generated/apps.conf
